name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Emit Prisma contract and plan learning-engine migrations
        env:
          DATABASE_URL: postgresql://local:local@localhost:5432/recalldose?sslmode=disable
        run: |
          npx prisma contract emit
          existing_migration="$(find migrations/app -mindepth 1 -maxdepth 1 -type d -name '*_learning_engine_completion' | head -n 1)"
          if [ -n "$existing_migration" ]; then
            start_contract="$(node -e "const p=require('./'+process.argv[1]+'/migration.json'); console.log(p.from || '')" "$existing_migration")"
            if [ "$start_contract" != "950f5b1bbd7028915d8c9772db39543764ee6b1be22ff835cf548c254f4fa7f6" ]; then
              target_contract="$(node -e "const p=require('./'+process.argv[1]+'/migration.json'); console.log(p.to || '')" "$existing_migration")"
              echo "Removing a learning-engine migration planned from a stale contract ref."
              rm -rf "$existing_migration"
              if [ -n "$target_contract" ]; then
                rm -rf "migrations/snapshots/$target_contract"
              fi
              existing_migration=""
            fi
          fi
          if [ -z "$existing_migration" ]; then
            npx prisma migration plan --from 20261122T1354_persist_study_content --name learning_engine_completion
          fi
          npx prisma migration check

      - name: Commit generated Prisma artifacts to this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add src/prisma/contract.json src/prisma/contract.d.ts migrations/
          if git diff --cached --quiet; then
            echo "Prisma artifacts are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(prisma): emit study-content contract and migration"
          git push origin "HEAD:${PR_BRANCH}"

      - name: Build frontend
        run: npm run build

      - name: Typecheck server
        run: npm run typecheck:server
